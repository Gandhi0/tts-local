name: Build & Sign Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22.21.0'        # package.json pide >=22.21.0
      YARN_VERSION: '1.22.22'
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack and prepare yarn@1
        run: |
          corepack enable
          corepack prepare yarn@${{ env.YARN_VERSION }} --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: yarn-${{ hashFiles('**/yarn.lock') }}-${{ runner.os }}
          restore-keys: yarn-

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Java (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK cmdline-tools + packages
        run: |
          set -e
          ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT }}
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Print versions
        run: |
          node -v
          yarn -v
          java -version
          sdkmanager --version || true

      - name: Restore keystore from secret (Base64) and write gradle props
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set - aborting keystore restore step"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          mkdir -p $HOME/.gradle
          cat > $HOME/.gradle/gradle.properties <<EOF
MYAPP_UPLOAD_STORE_FILE=android/app/upload-keystore.jks
MYAPP_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}
MYAPP_UPLOAD_KEY_ALIAS=${KEYSTORE_ALIAS}
MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
EOF
          echo "Wrote gradle.properties with signing props to $HOME/.gradle/gradle.properties"

      - name: Build release AAB and APK (Gradle)
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          _JAVA_OPTIONS: -Xmx3g
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Find and upload artifacts (AAB/APK)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
